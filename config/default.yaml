camera:
  source: 0
  frame_width: 1280
  frame_height: 720
  fps: 25
  # Process half the frames to reduce CPU load.
  process_every_n_frames: 2

detection:
  # auto = cuda neu co GPU, khong thi mps, khong thi cpu.
  # YOLO26s @ 800px was benchmarked on RTX 3050 6 GB for this two-camera view.
  model_path: yolo26s.pt
  # Tuned on the IMOU office view: keeps partially occluded seated people.
  confidence_threshold: 0.25
  person_class_id: 0
  image_size: 800
  device: auto

tracking:
  max_lost_frames: 15
  min_hits: 2
  iou_threshold: 0.3

analytics:
  floor_width_m: 8.0
  floor_height_m: 6.0
  trajectory_length: 120
  # Replace these example image pixels with four measured floor landmarks.
  # Point order must match between image_points and floor_points.
  calibration:
    image_points:
      - [240, 700]
      - [1040, 700]
      - [820, 260]
      - [460, 260]
    floor_points:
      - [0.0, 0.0]
      - [8.0, 0.0]
      - [8.0, 6.0]
      - [0.0, 6.0]
  density_grid:
    rows: 4
    cols: 6
  zones:
    - name: entrance
      points: [[0.0, 0.0], [8.0, 0.0], [8.0, 1.5], [0.0, 1.5]]
    - name: room_center
      points: [[2.0, 1.5], [6.0, 1.5], [6.0, 5.0], [2.0, 5.0]]
  counting_line:
    start: [0.0, 1.5]
    end: [8.0, 1.5]
    entry_direction: positive_to_negative

output:
  save_video: true
  save_report: true
  display: false
  output_dir: output
  video_filename: annotated.mp4
  report_filename: report.json

# MVP trạng thái nhân viên xuyên 2 camera (tọa độ pixel ảnh 1280x720).
# Hãy chỉnh polygon cho khớp góc camera thực tế của bạn.
workstate:
  leave_grace_s: 10.0
  corridor_match_window_s: 300.0
  restroom_return_window_s: 900.0
  similarity_threshold: 0.55
  seats:
    - seat_id: seat_01
      name: "Bàn 1"
      channel: A
      polygon: [[400, 300], [640, 300], [640, 600], [400, 600]]
    - seat_id: seat_02
      name: "Bàn 2"
      channel: A
      polygon: [[680, 300], [920, 300], [920, 600], [680, 600]]
  corridor:
    hallway: [[100, 200], [1180, 200], [1180, 620], [100, 620]]
    exit_door: [[950, 200], [1180, 200], [1180, 400], [950, 400]]
