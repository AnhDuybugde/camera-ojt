camera:
  source: 0
  frame_width: 1280
  frame_height: 720
  fps: 25
  # Process half the frames to reduce CPU load.
  process_every_n_frames: 2

detection:
  # Thuần GPU: cuda bắt buộc. TensorRT FP16 dynamic batch
  # (build tu yolo26s.pt, TRT 10.9, sm_89). ~185 frame/s vs ~50 cua .pt.
  # Rebuild khi doi GPU/model:
  # yolo export model=yolo26s.pt format=engine half=True imgsz=640 device=0 dynamic=True batch=2
  # Nếu thiếu .engine / TRT sẽ tự fallback .pt (vẫn cuda) + cảnh báo.
  model_path: yolo26s.engine
  # Recall-first nhưng bớt ghost: 0.25 đủ cho ByteTrack low-conf nối lại.
  # 0.10 cũ đẻ quá nhiều box yếu -> ghost GID.
  confidence_threshold: 0.25
  nms_iou_threshold: 0.85
  # Loại thêm bbox nhỏ nằm gần như hoàn toàn trong bbox lớn.
  nested_box_containment_threshold: 0.85
  person_class_id: 0
  image_size: 640
  device: cuda

tracking:
  # Legacy IoUTracker (scripts/run_pipeline.py demo) dùng 2 dòng dưới.
  # Production ByteTrack (scripts/run_workstate.py) dùng từ track_high_threshold trở xuống.
  max_lost_frames: 15
  min_hits: 3
  iou_threshold: 0.3
  # IoU association của ByteTrack production (khác IoUTracker legacy).
  # 0.3 = de noi lai sau che (mac dinh cu 0.5 hay dut ID).
  track_high_threshold: 0.50
  track_low_threshold: 0.10
  new_track_threshold: 0.60
  byte_match_threshold: 0.80
  # Giu track mat dau 90 frame (~7s @ effective 12fps) de choi qua che/goc khuat.
  track_buffer: 90

# Global Identity Manager: giu Global Person ID on dinh xuyên tracklet,
# xuyên mat dau dai va xuyên channel (xem tracking/global_identity.py).
identity:
  gallery_size: 8
  # Chong swap ID khi 2 nguoi di qua nhau: appearance (body ReID) quyet
  # dinh chinh, spatial chi phu (0.05). Tong 4 trong so van = 1.0.
  appearance_weight: 0.70
  spatial_weight: 0.05
  time_weight: 0.15
  channel_weight: 0.10
  # Precision-first: thà bỏ sót còn hơn tái sử dụng nhầm Global ID.
  match_threshold: 0.70
  max_center_distance_ratio: 0.35
  # Reconnect thuan vi tri (khong co embedding) chi cho phep dich rat
  # nho: tranh noi nham tracklet sang GID nguoi ben canh khi che nhau.
  same_camera_reconnect_distance_ratio: 0.06
  same_camera_reconnect_s: 2.0
  min_appearance_similarity: 0.70
  named_appearance_floor: 0.70
  active_duplicate_similarity: 0.90
  temp_lost_s: 10.0
  long_lost_s: 120.0
  unresolved_keep_s: 86400.0
  min_gallery_confidence: 0.25
  # Event-driven ReID: track ổn định giữ ID theo spatial fast-path,
  # chỉ extract OSNet khi track mới / mất rồi quay lại / cross-camera.
  # refresh 10 bước (thay vì 5) để giảm ~90% ReID calls khi đông người.
  gallery_refresh_steps: 10
  tentative_min_hits: 5
  state_db: output/identity_state.db
  # Lightweight mặc định: x0_25 (~0.4M params, nhanh ~3x so với x1_0).
  # Cần chính xác hơn thì tune lên x0_5 / x1_0.
  reid_model: osnet_x0_25
  reid_device: cuda

analytics:
  floor_width_m: 8.0
  floor_height_m: 6.0
  trajectory_length: 120
  # Replace these example image pixels with four measured floor landmarks.
  # Point order must match between image_points and floor_points.
  calibration:
    image_points:
      - [240, 700]
      - [1040, 700]
      - [820, 260]
      - [460, 260]
    floor_points:
      - [0.0, 0.0]
      - [8.0, 0.0]
      - [8.0, 6.0]
      - [0.0, 6.0]
  density_grid:
    rows: 4
    cols: 6
  zones:
    - name: entrance
      points: [[0.0, 0.0], [8.0, 0.0], [8.0, 1.5], [0.0, 1.5]]
    - name: room_center
      points: [[2.0, 1.5], [6.0, 1.5], [6.0, 5.0], [2.0, 5.0]]
  counting_line:
    start: [0.0, 1.5]
    end: [8.0, 1.5]
    entry_direction: positive_to_negative

output:
  save_video: true
  save_report: true
  display: false
  output_dir: output
  video_filename: annotated.mp4
  report_filename: report.json

# Face attendance + nhan dien (InsightFace buffalo_s, thuần GPU).
# Thuần GPU: YOLO (cuda/TensorRT) + OSNet (cuda FP16) + InsightFace
# (CUDAExecutionProvider). MediaPipe palm chỉ chạy gated 3-5 FPS trên CPU.
# Camera substream 640x480: 0.45 + margin 0.05; mot face ro la xac nhan
# live/enroll (live crop đo được 0.476; gallery cross-person cao nhất 0.336).
face:
  enabled: true
  channels: [A, B]
  # cuda = bắt buộc GPU (khuyến nghị). auto = cuda nếu có provider, không thì cpu.
  face_device: cuda
  gallery_dir: data/images
  model_pack: buffalo_s
  match_threshold: 0.45
  min_margin: 0.05
  # Bind Employee ID + attendance ngay trong cung ket qua top-2 dau tien.
  consensus_hits: 1
  consensus_window_s: 3.0
  gallery_accept_threshold: 0.70
  gallery_max_prototypes: 10
  # Goc rong trong data/samples: mat thuong chi 15-30 px.
  min_face_px: 16
  min_face_score: 0.35
  # RTSP substream bi nen; 20 van loc mat qua mo nhung khong giu ket qua lau.
  min_blur_variance: 8.0
  min_person_area_px: 2500.0
  process_every_k: 2
  # Substream chỉ 640x480; dùng 640 để giữ recall với mặt 30-40 px.
  det_size: 640
  # Retry Face async: unknown 0.6s (~7 processed frame) nhanh hon cu 1.0s;
  # pipeline tu gian x2 khi worker queue day (may yeu). known 30s; voice lay min(...,2s).
  unknown_cooldown_s: 0.6
  known_cooldown_s: 30.0
  # Production van ve box mat (xanh=known, do=unknown) moi khi co FaceResult tuoi.
  name_map:
    AnhDuy: Anh Duy
    VanDai: Van Dai
    QuocNgoc: Quoc Ngoc
    LeHoang: Le Hoang
  employee_map:
    AnhDuy: "1"
    VanDai: "2"
    QuocNgoc: "3"
    LeHoang: "4"

attendance:
  # Face da qua threshold + margin + quality gate; ghi trong cung transaction
  # xu ly de Employee ID va attendance xuat hien dong thoi.
  debounce_hits: 1
  window_s: 8.0
  active_hour_start: null
  active_hour_end: null

room_fusion:
  leave_confirm_window_s: 300.0
  inroom_min_interval_s: 600.0
  absent_fallback_s: 900.0
  flush_s: 15.0

# Workstations in FLOOR METERS (same frame as analytics.calibration
# floor_points). Measure your desks and fill in; empty list = legacy
# presence-only business logic (visible = Working).
# Example:
# workstations:
#   - name: desk1
#     core: [[2.0, 2.5], [3.2, 2.5], [3.2, 3.5], [2.0, 3.5]]
#     extended: [[1.2, 1.7], [4.0, 1.7], [4.0, 4.3], [1.2, 4.3]]
workstations: []

# Position-based work state (foot point -> workstation ROI -> stabilizer).
workstate:
  grace_s: 1.5            # out of zone shorter than this keeps old state
  dwell_s: 2.0            # new zone held this long before commit
  assign_dwell_s: 5.0     # dwell in a core before it becomes "my" workstation
  hysteresis_m: 0.3       # spatial band against border flicker
  motion_influence: 0.0   # 0 = pure position+time (motion never decides)
  prune_after_s: 300.0    # forget per-ID memory after this absence
  person_map: {}          # {"LeHoAnhDuy": "desk1"} stable seat override
  # INTERIM (camera chua co dinh / chua ve ROI): lech tam bbox (0..1) khoi
  # diem neo vuot nguong nay -> Away. 0 = tat, chi dung hien dien
  # (khuyến nghị mặc định tới khi ROI được đo thật).
  move_ratio: 0.0
  settle_ratio: 0.02

# Voice: vay tay -> "Xin chao <ten>" (quen) / "Xin chào quý khách" (la).
# + face-triggered: dung truoc camera, nhan dien mat -> chao ngay ra loa
# camera (khong can vay tay). Bat bang --greet (edge-tts can mang lan dau,
# cache mp3 de offline sau).
# backend imou_p2p (mac dinh moi): TTS mp3 -> ffmpeg AAC -> P2P VisualTalk
# thang ra loa camera. Khong can browser/WebSDK/APP_ID. imou_web giu lai
# de fallback legacy.
voice:
  enabled: false
  backend: imou_p2p
  voice: vi-VN-HoaiMyNeural
  cache_dir: output/voice_cache
  # Thong nhat 10s cho ca quen lan la; chi kich hoat khi gio tay 4-5 ngon.
  cooldown_s: 10.0
  # Nguoi la gio tay: chao ngay, 10s duoc chao lai, khong can doi face.
  unknown_cooldown_s: 10.0
  palm_unknown_immediate: true
  unknown_phrase: Xin chào quý khách
  # Luot cho qua 10s thi bo (du cho nguoi den sau choi 1-2 luot phat).
  command_ttl_s: 10.0
  # Sau moi lan phat cho 1 nguoi, bo qua yeu cau chu dong cua chinh nguoi
  # do trong 5s (chong vay lien tuc spam loa).
  proactive_quiet_s: 5.0
  bridge_host: 127.0.0.1
  # 8765=stream, 8766=supervisor -> voice legacy dùng 8767 để khỏi đụng port.
  bridge_port: 8767
  talk_tail_s: 0.3
  launch_browser: true
  # A=phong (wave-only), B=cua (face-trigger). Global giu palm-only
  # de tuong thich cu; override per-channel ben duoi moi co hieu luc.
  greet_on_face: false
  greet_unknown_on_face: false
  # null = fallback ve global. Mac dinh: A khong chao mat, B thay mat la chao.
  greet_on_face_a: false
  greet_unknown_on_face_a: false
  greet_on_face_b: true
  greet_unknown_on_face_b: true
  # Gesture theo kenh: wave (vay tay, cho A) / palm (gio tay, legacy) / off.
  gesture_a: wave
  gesture_b: "off"
  # P2P VisualTalk (vendor tu test-sound-camera-imou): chi can
  # IMOU_DEVICE_ID (serial) + IMOU_CAMERA_PASSWORD (safety code).
  # Loa theo kenh phat hien: A (phong) -> p2p_channel, B (cua) -> p2p_channel_b.
  p2p_channel: 1
  p2p_channel_b: 2
  p2p_timeout_s: 20.0
  p2p_attempts: 2
  p2p_retry_delay_s: 5.0
  p2p_sample_rate: 16000
  # 0.0=im lang, 0.2=nho, 0.5=nua am luong, 1.0=giu nguyen file TTS.
  p2p_volume: 1.0
  # WAV chao tao san (scripts/build_greeting_wavs.py, ZeroTTS).
  greeting_dir: output/voice_greetings
  zerotts_voice: maichi
  zerotts_model: zeroweight-ai/ZeroTTS
  # every_k=3, window=2.5s -> ~10 mau co tay/window, du cho min_reversals=2.
  # (every_k cu =6 chi ~3 mau/1.5s -> khong bao gio du dao chieu.)
  # Wave la gesture chinh cho A=phong (vay tay de chao).
  wave_every_k: 3
  wave_max_people: 2
  wave_window_s: 2.5
  wave_min_reversals: 2
  wave_min_amplitude: 0.06
  wave_min_gap_s: 0.08
  wave_cooldown_s: 10.0
  # Chi focus nguoi co bbox lon nhat; hysteresis ngan focus/ID nhay lien tuc.
  focus_switch_area_ratio: 1.20
  focus_switch_hold_s: 0.50
  focus_lost_grace_s: 1.00
  # Wave bat buoc: 5 ngon xoe -> giu palm activation -> lac qua lai.
  wave_required_fingers: 5
  wave_palm_confirm_frames: 2
  # Cho phep MediaPipe hut ngan khi ban tay dao huong/cheo canh; chi mau OPEN
  # moi duoc dem, nhung khong xoa ngay lich su cua mot cai vay dang dien ra.
  wave_palm_release_frames: 5
  wave_face_ttl_s: 8.0
  wave_face_max_distance: 3.5
  # Unknown ro mat duoc uu tien, nhung aging dam bao moi nguoi deu co luot.
  face_background_aging_s: 5.0
  # Legacy pose thresholds: van doc config cu, khong con chan wave.
  face_frontal_nose_tol: 0.18
  face_frontal_roll_tol: 0.18
  face_frontal_min_eye_ratio: 0.20
  # Chao khach la cho doi dinh danh 2s: neu mat xac nhan kip thi chi chao
  # ten, khong chao "quy khach" nua (chong noi 2 cau lien tiep o cua B).
  unknown_greet_delay_s: 2.0
  # Open-palm: 4-5 ngon o vung dau/vai -> chao. Gated tren CPU.
  palm_every_k: 2
  palm_max_people: 6
  palm_cooldown_s: 10.0
  # Mot palm hop le la du, nhung mat va tay phai cung Global ID va o gan nhau.
  palm_confirm_frames: 1
  palm_release_frames: 2
  palm_min_detection_confidence: 0.35
  palm_required_fingers: 4
  palm_min_input_height_px: 320
  palm_head_region_max_y: 0.60
  palm_allow_without_face: true
  palm_face_ttl_s: 8.0
  palm_face_max_distance: 3.5
  palm_min_person_area_px: 2500.0
  # Face async worker: moi camera/GID toi da 1 job; queue du cho nhieu nguoi
  # ma khong xoa job cu truoc khi worker kip xu ly.
  face_max_queue: 8
  face_max_job_age_s: 5.0
  face_recheck_s: 30.0
  # Voice-trigger hello imou DA BO. STT medium-only cho Ha Linh.
  voice_trigger_enabled: false
  trigger_phrase_dir: config/voice_triggers
  # Cụm bổ sung ngoài folder (nối thêm, ít dùng).
  voice_trigger_words: []
  voice_trigger_window_s: 5.0
  # P6: inhibit hiệu lực = max(cấu hình, câu chào dài nhất + đuôi vang dưới).
  voice_trigger_inhibit_s: 12.0
  voice_trigger_echo_tail_s: 2.0
  # P5: voice chỉ hiệu lực khi có mặt tươi trong 3s và người đủ lớn
  # (chống tiếng gọi từ xa ngoài khung hình — mic toàn cục).
  voice_face_ttl_s: 3.0
  voice_min_person_area_px: 2500.0
  # P1: ngưỡng VAD động bám nền ồn (trị ồn đều, không cần đo phòng).
  voice_vad_floor_factor: 3.0
  # Mic camera nay nen on rat thap (~0.0005) -> san thap de bat tieng nho.
  voice_vad_floor_min: 0.004
  voice_vad_ceiling: 0.15
  # P3: đoạn chỉ đi STT khi to hơn nền >= 10dB (bỏ ồn to đều/tiếng xa nhỏ).
  voice_snr_min_db: 10.0
  # medium-only cho Ha Linh (small da bo).
  voice_stt_model: medium
  voice_stt_lang: vi
  voice_listen_channel: 1
  voice_listen_subtype: 1
  # Do thuc te mic sau filter: noise p50~0.0014, speech p90~0.035.
  voice_vad_threshold: 0.004
  voice_min_seg_rms: 0.003
  # P4: cửa chất lượng STT siết (model nhỏ vốn đã ít bịa chữ từ ồn).
  voice_max_no_speech_prob: 0.40
  # Nguong -0.90: tha giong that noi nho (vd -0.84) nhung van chan
  # chu bia kieu "Tat nhien." (-1.05).
  voice_min_avg_logprob: -0.90
  # Luu moi doan voice di STT ra WAV de nghe lai ("" = tat).
  voice_dump_dir: output/voice_dumps

store:
  local_faces_dir: data/faces
  queue_db: output/queue.db
  supabase_enabled: true
  max_crops_per_owner_day: 5
  face_jpeg_quality: 80
  face_max_side_px: 512
