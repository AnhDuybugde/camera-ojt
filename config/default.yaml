camera:
  source: 0
  frame_width: 1280
  frame_height: 720
  fps: 25
  # Process half the frames to reduce CPU load.
  process_every_n_frames: 2

detection:
  # auto = cuda neu co GPU, khong thi mps, khong thi cpu.
  # YOLO26s @ 800px was benchmarked on RTX 3050 6 GB for this two-camera view.
  model_path: yolo26s.pt
  # Tuned on the IMOU office view: keeps partially occluded seated people.
  confidence_threshold: 0.25
  person_class_id: 0
  image_size: 800
  device: auto

tracking:
  max_lost_frames: 15
  min_hits: 2
  iou_threshold: 0.3

# Global Identity Manager: giu Global Person ID on dinh xuyên tracklet,
# xuyên mat dau dai va xuyên channel (xem tracking/global_identity.py).
identity:
  gallery_size: 8
  appearance_weight: 0.55
  spatial_weight: 0.20
  time_weight: 0.15
  channel_weight: 0.10
  match_threshold: 0.40
  max_center_distance_ratio: 0.35
  min_appearance_similarity: 0.30
  temp_lost_s: 5.0
  long_lost_s: 60.0
  unresolved_keep_s: 300.0
  min_gallery_confidence: 0.25

analytics:
  floor_width_m: 8.0
  floor_height_m: 6.0
  trajectory_length: 120
  # Replace these example image pixels with four measured floor landmarks.
  # Point order must match between image_points and floor_points.
  calibration:
    image_points:
      - [240, 700]
      - [1040, 700]
      - [820, 260]
      - [460, 260]
    floor_points:
      - [0.0, 0.0]
      - [8.0, 0.0]
      - [8.0, 6.0]
      - [0.0, 6.0]
  density_grid:
    rows: 4
    cols: 6
  zones:
    - name: entrance
      points: [[0.0, 0.0], [8.0, 0.0], [8.0, 1.5], [0.0, 1.5]]
    - name: room_center
      points: [[2.0, 1.5], [6.0, 1.5], [6.0, 5.0], [2.0, 5.0]]
  counting_line:
    start: [0.0, 1.5]
    end: [8.0, 1.5]
    entry_direction: positive_to_negative

output:
  save_video: true
  save_report: true
  display: false
  output_dir: output
  video_filename: annotated.mp4
  report_filename: report.json
