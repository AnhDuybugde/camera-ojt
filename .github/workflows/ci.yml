name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev,voice,store]"
          pip install ./frontend/vendor/insightface-0.7.3-py3-none-any.whl onnxruntime bcrypt
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt
      - name: Frontend tests
        working-directory: frontend
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: backend/dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: backend/dashboard
        run: npm run build
