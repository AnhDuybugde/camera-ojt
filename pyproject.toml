[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-tracking"
version = "0.1.0"
description = "Camera-based people flow, density, and movement tracking for indoor rooms."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0,<2",
    "opencv-python>=4.10.0,<4.12",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.7.0",
    "ultralytics>=8.4.0",
    "scipy>=1.10.0",
    "lap>=0.5.12",
]

[project.optional-dependencies]
  dev = ["pytest>=8.2.0", "ruff>=0.5.0"]
  ui = ["streamlit>=1.37,<2", "pandas>=2,<3", "bcrypt>=4.1,<5", "gspread>=6,<7", "google-auth>=2.28,<3"]
  face = ["insightface>=0.7.3", "onnxruntime>=1.17.0"]
  store = ["supabase>=2.9.0"]
  reid = ["torchreid>=0.2.5", "gdown>=6.0.0"]
  voice = ["edge-tts>=7.0.0", "mediapipe>=0.10.14", "imageio-ffmpeg>=0.5.0", "cryptography>=41.0.0", "zerotts>=0.1.0", "soundfile>=0.12.0", "faster-whisper>=1.0.0", "google-genai>=1.0.0", "psutil>=5.9.0"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["camera_tracking*", "backend*", "frontend*"]
namespaces = false

[project.scripts]
camera-ojt = "camera_tracking.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
